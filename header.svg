<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #FFFFFF;
      }
      .highlight {
        fill: url(#text-glow);
      }
      .phrase {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        font-size: 22px;
        fill: #A0AEC0;
        opacity: 0;
      }
      .phrase-1 { animation: cycle-1 12s infinite; }
      .phrase-2 { animation: cycle-2 12s infinite; }
      .phrase-3 { animation: cycle-3 12s infinite; }
      .phrase-4 { animation: cycle-4 12s infinite; }
      
      @keyframes cycle-1 {
        0%, 22% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      @keyframes cycle-2 {
        0%, 25% { opacity: 0; }
        28%, 47% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes cycle-3 {
        0%, 50% { opacity: 0; }
        53%, 72% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes cycle-4 {
        0%, 75% { opacity: 0; }
        78%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }
      
      /* Tech Graphics Orbit Animations */
      .pulse-circle {
        animation: pulse 3s infinite;
      }
      @keyframes pulse {
        0% { r: 6px; opacity: 0.4; }
        50% { r: 9px; opacity: 0.95; }
        100% { r: 6px; opacity: 0.4; }
      }
      
      .orbit-1 {
        animation: rotate 15s linear infinite;
        transform-origin: 670px 80px;
      }
      .orbit-2 {
        animation: rotate-reverse 10s linear infinite;
        transform-origin: 670px 80px;
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotate-reverse {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
    </style>
  </defs>
  
  <!-- Sleek dark theme bg -->
  <rect width="100%" height="100%" fill="#0D1117" rx="10" />
  
  <!-- Grid Lines -->
  <g stroke="#21262D" stroke-width="1" fill="none">
    <line x1="500" y1="0" x2="500" y2="160" />
    <line x1="0" y1="120" x2="800" y2="120" />
  </g>
  
  <!-- Animated Orbit Tech Core on Right -->
  <g stroke="#21262D" stroke-width="1.5" fill="none">
    <!-- Center glowing core -->
    <circle cx="670" cy="80" r="7" fill="#00f2fe" class="pulse-circle" />
    
    <!-- Concentric Orbit rings -->
    <circle cx="670" cy="80" r="32" stroke="#21262D" />
    <circle cx="670" cy="80" r="50" stroke="#21262D" stroke-dasharray="4 4" />
    <circle cx="670" cy="80" r="68" stroke="#1F242C" />
    
    <!-- Orbit 1: Inner revolving bodies -->
    <g class="orbit-1">
      <circle cx="702" cy="80" r="4.5" fill="#4facfe" />
      <circle cx="638" cy="80" r="4.5" fill="#00f2fe" />
    </g>
    
    <!-- Orbit 2: Outer revolving bodies -->
    <g class="orbit-2">
      <circle cx="670" cy="130" r="4" fill="#FF007A" />
      <circle cx="670" cy="30" r="4" fill="#9B51E0" />
    </g>
  </g>
  
  <!-- Title and Name -->
  <text x="30" y="65" class="title">Hi, I'm <tspan class="highlight">Prakhar Shukla</tspan> 👋</text>
  
  <!-- Animated Subtitles -->
  <g transform="translate(30, 110)">
    <text class="phrase phrase-1" x="0" y="0">🚀 Full Stack Engineer &amp; SaaS Creator</text>
    <text class="phrase phrase-2" x="0" y="0">🤖 AI Engineer &amp; RAG Systems Specialist</text>
    <text class="phrase phrase-3" x="0" y="0">💻 Software Architect &amp; Open Source Contributor</text>
    <text class="phrase phrase-4" x="0" y="0">📊 Competitive Programmer &amp; Problem Solver</text>
  </g>
</svg>
